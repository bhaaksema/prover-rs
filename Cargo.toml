[package]
name = "prover-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
internment = "0.8.6"
mrs-tptp = "0.2.3"
rustsat = "0.7.5"
rustsat-batsat = { version = "0.7.5", optional = true }
rustsat-cadical = { version = "0.7.5", optional = true }
rustsat-glucose = { version = "0.7.5", optional = true }
rustsat-kissat = { version = "0.7.5", optional = true }
rustsat-minisat = "0.7.5"

[features]
batsat = ["dep:rustsat-batsat"]
cadical = ["dep:rustsat-cadical"]
glucose = ["dep:rustsat-glucose"]
kissat = ["dep:rustsat-kissat"]
